<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gain Eager — Skybound</title>
<style>
  :root{
    --ink:#f2f5f7; --muted:#9fb0bd; --line:rgba(226,238,245,.22);
    --accent:#ffb547; --panel:rgba(6,12,18,.42); --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1522;color:var(--ink);font-family:var(--mono)}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .corner{position:absolute;padding:18px 22px}
  .tl{top:0;left:0}
  .tr{top:0;right:0;text-align:right}
  .bl{bottom:0;left:0}
  .br{bottom:0;right:0;text-align:right}
  .eyebrow{font-size:10px;letter-spacing:.38em;color:var(--accent);text-transform:uppercase}
  .title{margin-top:6px;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(30px,4.2vw,64px);
    line-height:.9;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 3px 24px rgba(0,0,0,.45)}
  .sub{margin-top:8px;font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .rule{height:1px;background:var(--line);margin:12px 0}
  .readout{display:grid;grid-template-columns:auto auto;gap:5px 22px;font-size:12px;letter-spacing:.05em}
  .readout .k{color:var(--muted)}
  .readout .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
  .badge{display:inline-block;border:1px solid var(--line);border-radius:2px;padding:5px 9px;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;background:var(--panel)}
  .badge.live{border-color:rgba(255,181,71,.55);color:var(--accent)}
  .keys{font-size:11px;line-height:1.85;color:var(--ink);opacity:.85}
  .keys b{color:var(--ink);font-weight:600}
  .bar{position:absolute;left:50%;top:26px;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
  button{font:inherit;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:9px 14px;cursor:pointer;
    backdrop-filter:blur(8px)}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.on{border-color:var(--accent);color:var(--accent)}
  #reticle{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.5}
  #reticle:before,#reticle:after{content:"";position:absolute;background:var(--ink)}
  #reticle:before{left:8px;top:0;width:1px;height:18px}
  #reticle:after{top:8px;left:0;height:1px;width:18px}
  .fade{position:fixed;inset:0;background:#0a1522;z-index:20;display:grid;place-items:center;
    font-size:11px;letter-spacing:.3em;color:var(--muted);transition:opacity .7s}
  .fade.gone{opacity:0;pointer-events:none}
  @media (max-width:700px){.keys,.bl{display:none}.tr .readout{display:none}}
</style>
<script type="importmap">
{"imports":{
  "three":"./vendor/three.module.js",
  "three/addons/":"./vendor/addons/"
}}
</script>
</head>
<body>
<div id="stage"></div>
<div class="fade" id="loader">INITIALIZING FLIGHT SYSTEMS</div>

<div class="hud">
  <div class="corner tl">
    <div class="eyebrow">Pilot 01 / Free flight</div>
    <div class="title">Gain Eager</div>
    <div class="sub">Skybound — high altitude study</div>
  </div>
  <div class="bar">
    <button id="btnMode" title="Toggle autopilot / manual">Autopilot</button>
    <button id="btn4k" title="Export a 3840×2160 still">4K still</button>
    <button id="btnLook" title="Cycle time of day">Golden hour</button>
  </div>
  <div class="corner tr">
    <div class="badge live" id="badge">● Autopilot engaged</div>
    <div class="rule"></div>
    <div class="readout">
      <span class="k">Airspeed</span><span class="v" id="vSpeed">—</span>
      <span class="k">Altitude</span><span class="v" id="vAlt">—</span>
      <span class="k">Bank</span><span class="v" id="vBank">—</span>
      <span class="k">Load</span><span class="v" id="vG">—</span>
      <span class="k">FPS</span><span class="v" id="vFps">—</span>
      <span class="k">Draw calls</span><span class="v" id="vCalls">—</span>
      <span class="k">Triangles</span><span class="v" id="vTris">—</span>
    </div>
  </div>
  <div class="corner bl">
    <div class="keys">
      <div><b>A / D</b> bank &nbsp; <b>W / S</b> throttle &nbsp; <b>↑ / ↓</b> pitch</div>
      <div><b>M</b> autopilot &nbsp; <b>L</b> light &nbsp; <b>P</b> 4K still &nbsp; <b>H</b> hide HUD</div>
    </div>
  </div>
  <div class="corner br">
    <div class="eyebrow">Three.js / WebGL2</div>
    <div class="sub" id="vRes">—</div>
  </div>
  <div id="reticle"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const status = { ready:false, errors:[], frames:0, clouds:0, captures:0 };
window.__SKY_STATUS__ = status;
window.addEventListener('error', e => status.errors.push(String(e.message)));

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.72;
renderer.info.autoReset = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.5, 12000);
scene.fog = new THREE.FogExp2(0x8fb4d2, 0.00026);

// ---------------------------------------------------------------- sky dome
const sunDir = new THREE.Vector3(0.62, 0.16, -0.76).normalize();
const skyUniforms = {
  uSunDir:{value:sunDir},
  uZenith:{value:new THREE.Color(0x062450)},
  uHorizon:{value:new THREE.Color(0x6a9fc8)},
  uHaze:{value:new THREE.Color(0xff9d52)},
  uSunPower:{value:1.0}
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(6000, 48, 32),
  new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false, uniforms:skyUniforms,
    vertexShader:`varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader:`
      varying vec3 vDir; uniform vec3 uSunDir,uZenith,uHorizon,uHaze; uniform float uSunPower;
      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y*0.5+0.5,0.0,1.0);
        vec3 col = mix(uHorizon, uZenith, smoothstep(0.48,0.94,h));
        float nearHorizon = 1.0 - smoothstep(0.0,0.22,abs(d.y));
        col = mix(col, uHaze, nearHorizon*0.16);
        float cosA = max(dot(d, normalize(uSunDir)),0.0);
        col += uHaze * pow(cosA, 9.0) * 0.22 * uSunPower;
        col += vec3(1.0,0.93,0.78) * pow(cosA, 900.0) * 1.8 * uSunPower;
        gl_FragColor = vec4(col,1.0);
      }`
  })
);
sky.frustumCulled = false;
scene.add(sky);

// sun glow sprite
function radialTexture(stops){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  for(const s of stops){
    const g = x.createRadialGradient(128,128,0,128,128,128);
    g.addColorStop(0,s[0]); g.addColorStop(s[1],s[2]); g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0,0,256,256);
  }
  return new THREE.CanvasTexture(c);
}
const glowTex = radialTexture([
  ['rgba(255,246,222,1)',0.10,'rgba(255,246,222,0)'],
  ['rgba(255,190,110,.55)',0.34,'rgba(255,190,110,0)'],
]);
const sun = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffffff,transparent:true,
  blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
sun.scale.setScalar(900);
sun.position.copy(sunDir).multiplyScalar(4200);
scene.add(sun);

// ---------------------------------------------------------------- clouds
function cloudTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.clearRect(0,0,256,256);
  const puffs = [[128,142,74,1],[78,150,52,.85],[180,148,56,.82],[105,112,56,.8],[156,110,52,.72],[128,90,42,.62]];
  for(const [px,py,r,a] of puffs){
    const g = x.createRadialGradient(px,py,0,px,py,r);
    g.addColorStop(0,`rgba(255,255,255,${a})`);
    g.addColorStop(0.55,`rgba(246,250,255,${a*0.72})`);
    g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0,0,256,256);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const CLOUDS = 720;
const base = new THREE.PlaneGeometry(1,1);
const cloudGeo = new THREE.InstancedBufferGeometry();
cloudGeo.index = base.index;
cloudGeo.setAttribute('position', base.attributes.position);
cloudGeo.setAttribute('uv', base.attributes.uv);
const off = new Float32Array(CLOUDS*3), scl = new Float32Array(CLOUDS*2), alp = new Float32Array(CLOUDS), seed = new Float32Array(CLOUDS);
for(let i=0;i<CLOUDS;i++){
  const deck = i < CLOUDS*0.42;
  off[i*3]   = (Math.random()-.5)*2100;
  off[i*3+1] = deck ? -34 + Math.random()*36 : 30 + Math.random()*240;
  off[i*3+2] = (Math.random()-.5)*2100;
  const s = deck ? 130+Math.random()*210 : 42+Math.random()*120;
  scl[i*2] = s; scl[i*2+1] = s*(0.42+Math.random()*0.2);
  alp[i] = deck ? .52+Math.random()*.22 : .42+Math.random()*.38;
  seed[i] = Math.random()*10;
}
cloudGeo.setAttribute('iOffset', new THREE.InstancedBufferAttribute(off,3));
cloudGeo.setAttribute('iScale', new THREE.InstancedBufferAttribute(scl,2));
cloudGeo.setAttribute('iAlpha', new THREE.InstancedBufferAttribute(alp,1));
cloudGeo.setAttribute('iSeed', new THREE.InstancedBufferAttribute(seed,1));
cloudGeo.instanceCount = CLOUDS;
const cloudMat = new THREE.ShaderMaterial({
  uniforms:{ uMap:{value:cloudTexture()}, uTime:{value:0}, uTint:{value:new THREE.Color(0xdceaf5)} },
  transparent:true, depthWrite:false, side:THREE.DoubleSide,
  vertexShader:`
    attribute vec3 iOffset; attribute vec2 iScale; attribute float iAlpha; attribute float iSeed;
    uniform float uTime; varying vec2 vUv; varying float vAlpha; varying float vFade;
    void main(){
      vec3 o = iOffset;
      o.x += sin(uTime*0.045 + iSeed)*14.0;
      o.z += cos(uTime*0.031 + iSeed)*9.0;
      vec4 mv = modelViewMatrix * vec4(o,1.0);
      mv.xy += position.xy * iScale;
      vFade = smoothstep(25.0, 160.0, -mv.z);
      vFade *= 1.0 - smoothstep(1500.0, 2900.0, -mv.z);
      vUv = uv; vAlpha = iAlpha;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    uniform sampler2D uMap; uniform vec3 uTint;
    varying vec2 vUv; varying float vAlpha; varying float vFade;
    void main(){
      vec4 t = texture2D(uMap, vUv);
      float a = t.a * vAlpha * vFade;
      if(a < 0.01) discard;
      gl_FragColor = vec4(uTint * t.rgb, a);
    }`
});
const clouds = new THREE.Mesh(cloudGeo, cloudMat);
clouds.frustumCulled = false;
scene.add(clouds);
status.clouds = CLOUDS;

// ---------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x516173, 1.15));
const key = new THREE.DirectionalLight(0xfff0d2, 2.2);
key.position.copy(sunDir).multiplyScalar(600);
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fd0ff, 1.1);
rim.position.set(-300,180,300);
scene.add(rim);

// ---------------------------------------------------------------- pilot
const M = {
  skin:new THREE.MeshStandardMaterial({color:0x5e3a26,roughness:.78,metalness:0}),
  skinShadow:new THREE.MeshStandardMaterial({color:0x241610,roughness:.85}),
  suit:new THREE.MeshStandardMaterial({color:0x182634,roughness:.52,metalness:.22}),
  suitAlt:new THREE.MeshStandardMaterial({color:0x24384b,roughness:.55,metalness:.18}),
  accent:new THREE.MeshStandardMaterial({color:0xffb547,roughness:.35,metalness:.5}),
  scarf:new THREE.MeshStandardMaterial({color:0xc24333,roughness:.9,side:THREE.DoubleSide}),
  goggle:new THREE.MeshStandardMaterial({color:0x0d1218,roughness:.2,metalness:.65}),
  lens:new THREE.MeshStandardMaterial({color:0x8fdcff,emissive:0x2e86ad,emissiveIntensity:.7,roughness:.12,metalness:.35}),
  metal:new THREE.MeshStandardMaterial({color:0x39434c,roughness:.35,metalness:.85}),
  flame:new THREE.MeshBasicMaterial({color:0x9fe8ff,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false})
};
function limb(a,b,r,mat,parent){
  const d = new THREE.Vector3().subVectors(b,a);
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, Math.max(.001,d.length()-2*r), 6, 12), mat);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.clone().normalize());
  parent.add(m); return m;
}
const pilot = new THREE.Group();
const body = new THREE.Group();
pilot.add(body);
// torso, pelvis, head (+Z is forward)
const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.27,.62,8,16), M.suit);
torso.rotation.x = Math.PI/2; body.add(torso);
const chest = new THREE.Mesh(new THREE.BoxGeometry(.42,.16,.5), M.suitAlt);
chest.position.set(0,.14,.12); body.add(chest);
for(const s of [-1,1]){
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(.07,.03,.46), M.accent);
  stripe.position.set(s*.14,.23,.12); body.add(stripe);
}
const pelvis = new THREE.Mesh(new THREE.SphereGeometry(.25,16,12), M.suit);
pelvis.scale.set(1,.8,1.15); pelvis.position.z = -.5; body.add(pelvis);
const neck = new THREE.Mesh(new THREE.CylinderGeometry(.1,.12,.2,12), M.skin);
neck.rotation.x = Math.PI/2; neck.position.set(0,.05,.58); body.add(neck);
const headGroup = new THREE.Group();
headGroup.position.set(0,.1,.72);
headGroup.rotation.y = 2.28;   // glances back over the shoulder toward the chase camera
body.add(headGroup);
const head = new THREE.Mesh(new THREE.SphereGeometry(.235,24,18), M.skin);
head.scale.set(1,1.06,1.02); headGroup.add(head);
const hair = new THREE.Mesh(new THREE.SphereGeometry(.238,20,14,0,Math.PI*2,0,Math.PI*.52), M.skinShadow);
hair.position.set(0,.015,0); hair.rotation.x = -.12; headGroup.add(hair);
for(const s of [-1,1]){
  const ear = new THREE.Mesh(new THREE.SphereGeometry(.045,10,8), M.skin);
  ear.position.set(s*.225,-.01,0); headGroup.add(ear);
  const g = new THREE.Mesh(new THREE.CylinderGeometry(.095,.095,.045,18), M.goggle);
  g.rotation.z = Math.PI/2; g.position.set(s*.105,.06,.18); headGroup.add(g);
  const l = new THREE.Mesh(new THREE.CylinderGeometry(.072,.072,.05,18), M.lens);
  l.rotation.z = Math.PI/2; l.position.set(s*.105,.06,.205); headGroup.add(l);
}
const nose = new THREE.Mesh(new THREE.ConeGeometry(.045,.13,10), M.skin);
nose.rotation.x = Math.PI/2; nose.position.set(0,-.03,.22); headGroup.add(nose);
const strap = new THREE.Mesh(new THREE.BoxGeometry(.46,.045,.05), M.goggle);
strap.position.set(0,.055,.16); headGroup.add(strap);
// arms swept forward
for(const s of [-1,1]){
  const sh = new THREE.Vector3(s*.27,.03,.32);
  const el = new THREE.Vector3(s*.58,.02,.6);
  const ha = new THREE.Vector3(s*.72,.0,.92);
  limb(sh,el,.105,M.suit,body);
  limb(el,ha,.085,M.skin,body);
  const glove = new THREE.Mesh(new THREE.SphereGeometry(.09,12,10),M.skin);
  glove.position.copy(ha); body.add(glove);
  const shJ = new THREE.Mesh(new THREE.SphereGeometry(.115,12,10),M.suitAlt); shJ.position.copy(sh); body.add(shJ);
}
// legs trailing
for(const s of [-1,1]){
  const hp = new THREE.Vector3(s*.14,-.07,-.52);
  const kn = new THREE.Vector3(s*.18,-.16,-1.02);
  const ft = new THREE.Vector3(s*.2,-.22,-1.42);
  limb(hp,kn,.13,M.suit,body);
  limb(kn,ft,.105,M.suitAlt,body);
  const boot = new THREE.Mesh(new THREE.BoxGeometry(.18,.14,.3),M.goggle);
  boot.position.copy(ft); body.add(boot);
}
// scarf: animated ribbon
const scarfSegs = [];
for(let i=0;i<10;i++){
  const seg = new THREE.Mesh(new THREE.BoxGeometry(.16,.035,.24), M.scarf);
  body.add(seg); scarfSegs.push(seg);
}
// jetpack + exhaust
const pack = new THREE.Mesh(new THREE.BoxGeometry(.46,.32,.42), M.metal);
pack.position.set(0,-.2,-.28); body.add(pack);
const flames = [];
for(const s of [-1,1]){
  const noz = new THREE.Mesh(new THREE.CylinderGeometry(.085,.11,.2,12), M.metal);
  noz.rotation.x = Math.PI/2; noz.position.set(s*.15,-.2,-.54); body.add(noz);
  const fl = new THREE.Mesh(new THREE.ConeGeometry(.075,.75,12), M.flame);
  fl.rotation.x = -Math.PI/2; fl.position.set(s*.15,-.2,-.95); body.add(fl); flames.push(fl);
}
// small cloth wings
const wingMat = new THREE.MeshStandardMaterial({color:0xe8b04a,roughness:.8,side:THREE.DoubleSide,
  transparent:true,opacity:.92});
const wings = [];
for(const s of [-1,1]){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([
    0,0,0,  s*1.9,.12,-.55,  s*1.15,-.05,-1.25,
    0,0,0,  s*1.15,-.05,-1.25,  s*.2,-.02,-1.0
  ],3));
  g.computeVertexNormals();
  const w = new THREE.Mesh(g,wingMat); w.position.set(s*.25,.02,.18); body.add(w); wings.push(w);
}
pilot.scale.setScalar(1.35);
scene.add(pilot);

// speed trail (points)
const TN = 220;
const tPos = new Float32Array(TN*3);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(tPos,3));
const trail = new THREE.Points(trailGeo, new THREE.PointsMaterial({color:0xffe3b0,size:.42,
  map:radialTexture([['rgba(255,255,255,1)',0.18,'rgba(255,255,255,0)']]),
  transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));
trail.frustumCulled = false;
scene.add(trail);
let trailHead = 0;

// ---------------------------------------------------------------- flight path
const path = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-620, 95,  560), new THREE.Vector3(-260,160, 280),
  new THREE.Vector3( 120,130,  420), new THREE.Vector3( 520, 70, 120),
  new THREE.Vector3( 660,180, -260), new THREE.Vector3( 260,210, -620),
  new THREE.Vector3(-180,120, -520), new THREE.Vector3(-560, 80, -180),
], true, 'catmullrom', 0.5);
const PATH_LEN = path.getLength();
let tParam = 0.02, speed = 125, bank = 0, pitchV = 0, yaw = 0;
let manual = false;
const FORWARD = new THREE.Vector3(0,0,1);
const dir = new THREE.Vector3();
const targetQ = new THREE.Quaternion();
const keys = {};

function syncManualFromAuto(){
  yaw = Math.atan2(dir.x, dir.z);
  pitchV = Math.asin(THREE.MathUtils.clamp(dir.y,-1,1));
}
addEventListener('keydown', e=>{
  keys[e.key] = true;
  const k = e.key.toLowerCase();
  if(k==='m') toggleMode();
  if(k==='l') cycleLook();
  if(k==='p') export4K();
  if(k==='h') document.querySelector('.hud').style.display =
    document.querySelector('.hud').style.display==='none' ? '' : 'none';
});
addEventListener('keyup', e=>{ keys[e.key] = false; });

function toggleMode(){
  manual = !manual;
  if(manual) syncManualFromAuto();
  const b=document.getElementById('btnMode');
  const badge=document.getElementById('badge');
  b.textContent = manual ? 'Manual' : 'Autopilot';
  b.classList.toggle('on',manual);
  badge.textContent = manual ? '● Manual control' : '● Autopilot engaged';
}
document.getElementById('btnMode').addEventListener('click', toggleMode);

const looks = [
  {n:'Golden hour', z:0x062450, h:0x6a9fc8, haze:0xff9d52, sun:new THREE.Vector3(.62,.16,-.76), fog:0x8fb4d2},
  {n:'High noon',   z:0x07549f, h:0xa8d2ef, haze:0xffe9bc, sun:new THREE.Vector3(.25,.72,-.4), fog:0xb9dcf0},
  {n:'Storm light', z:0x101f31, h:0x5c7485, haze:0xa89886, sun:new THREE.Vector3(-.4,.1,-.7), fog:0x71899b},
];
let lookIdx = 0;
function cycleLook(){
  lookIdx = (lookIdx+1)%looks.length;
  const L = looks[lookIdx];
  skyUniforms.uZenith.value.setHex(L.z);
  skyUniforms.uHorizon.value.setHex(L.h);
  skyUniforms.uHaze.value.setHex(L.haze);
  sunDir.copy(L.sun).normalize();
  skyUniforms.uSunDir.value.copy(sunDir);
  sun.position.copy(sunDir).multiplyScalar(4200);
  key.position.copy(sunDir).multiplyScalar(600);
  scene.fog.color.setHex(L.fog);
  cloudMat.uniforms.uTint.value.setHex(lookIdx===2?0x9dafbe:0xdceaf5);
  document.getElementById('btnLook').textContent = L.n;
}
document.getElementById('btnLook').addEventListener('click', cycleLook);

// ---------------------------------------------------------------- post
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), .24, .42, 1.15);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- export
function export4K(){
  const W=3840,H=2160;
  const size = new THREE.Vector2(); renderer.getSize(size);
  const pr = renderer.getPixelRatio();
  try{
    renderer.setPixelRatio(1); renderer.setSize(W,H,false);
    camera.aspect = W/H; camera.updateProjectionMatrix();
    composer.setSize(W,H);
    composer.render();
    const data = renderer.domElement.toDataURL('image/png');
    window.__CAPTURES__ = window.__CAPTURES__ || [];
    window.__CAPTURES__.push(data);
    status.captures++;
    const a = document.createElement('a');
    a.href = data; a.download = 'gain-eager-skybound-4k.png'; a.click();
  } finally {
    renderer.setPixelRatio(pr); renderer.setSize(size.x,size.y,false);
    camera.aspect = size.x/size.y; camera.updateProjectionMatrix();
    composer.setSize(size.x,size.y);
  }
}
document.getElementById('btn4k').addEventListener('click', export4K);
document.getElementById('vRes').textContent = `${innerWidth}×${innerHeight} · export 3840×2160`;

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
let hudT = 0, frames = 0, fpsT = 0, fps = 0, prevBank = 0;
const camPos = new THREE.Vector3(-640,102,580);
const lookTarget = new THREE.Vector3();
const up = new THREE.Vector3(0,1,0);

function step(dtOverride){
  const dt = dtOverride ?? Math.min(clock.getDelta(), .05);
  const time = clock.elapsedTime;
  status.frames++; frames++;

  if(manual){
    const turn = (keys['a']?1:0)-(keys['d']?1:0);
    const pitch = (keys['ArrowUp']?1:0)-(keys['ArrowDown']?1:0);
    yaw += turn*dt*.85; pitchV = THREE.MathUtils.clamp(pitchV+pitch*dt*.55,-1.1,1.1);
    speed = THREE.MathUtils.clamp(speed + ((keys['w']?1:0)-(keys['s']?1:0))*55*dt, 45, 260);
    dir.set(Math.sin(yaw)*Math.cos(pitchV), Math.sin(pitchV), Math.cos(yaw)*Math.cos(pitchV)).normalize();
    pilot.position.addScaledVector(dir, speed*dt);
    bank = THREE.MathUtils.lerp(bank, -turn*.62, 1-Math.exp(-dt*3));
  } else {
    tParam = (tParam + speed*dt/PATH_LEN) % 1;
    path.getPointAt(tParam, pilot.position);
    path.getTangentAt(tParam, dir).normalize();
    const d2 = path.getTangentAt((tParam+.004)%1);
    const curve = new THREE.Vector3().crossVectors(dir,d2);
    bank = THREE.MathUtils.lerp(bank, THREE.MathUtils.clamp(curve.y*26,-.85,.85), 1-Math.exp(-dt*2.5));
  }

  targetQ.setFromUnitVectors(FORWARD, dir);
  pilot.quaternion.slerp(targetQ, 1-Math.exp(-dt*5));
  pilot.rotateZ(bank*0.02);
  body.rotation.x = Math.sin(time*2.2)*.012;

  // scarf + wings + flames
  for(let i=0;i<scarfSegs.length;i++){
    const s = scarfSegs[i], k=i/scarfSegs.length;
    s.position.set(Math.sin(time*3.2 - i*.55)*(.12+k*.5), .08+k*.16 - k*k*.5, .5 - k*2.5);
    s.rotation.y = Math.sin(time*3.2-i*.5)*.32;
    s.rotation.z = Math.sin(time*2.1-i*.4)*.2;
  }
  wings.forEach((w,i)=>{ w.rotation.z = Math.sin(time*1.6+i)*.045; });
  flames.forEach((f,i)=>{ f.scale.y = .8+Math.sin(time*24+i*2)*.18+speed/900; });

  // trail
  trailHead = (trailHead+1)%TN;
  tPos[trailHead*3] = pilot.position.x;
  tPos[trailHead*3+1] = pilot.position.y;
  tPos[trailHead*3+2] = pilot.position.z;
  trailGeo.attributes.position.needsUpdate = true;

  // camera chase
  const desired = pilot.position.clone().addScaledVector(dir,-7.2).addScaledVector(up,1.7);
  desired.add(new THREE.Vector3().crossVectors(dir,up).normalize().multiplyScalar(-bank*3));
  camPos.lerp(desired, 1-Math.exp(-dt*45));
  camera.position.copy(camPos);
  lookTarget.copy(pilot.position).addScaledVector(dir,7);
  camera.lookAt(lookTarget);
  camera.rotateZ(bank*.28);
  camera.fov = THREE.MathUtils.lerp(camera.fov, 58 + speed*.045, 1-Math.exp(-dt*2));
  camera.updateProjectionMatrix();

  cloudMat.uniforms.uTime.value = time;
  sky.position.copy(camera.position);
  renderer.info.reset();
  composer.render();

  fpsT += dt; if(fpsT>.5){ fps = Math.round(frames/fpsT); frames=0; fpsT=0; }
  hudT += dt;
  if(hudT>.12){
    hudT=0;
    const g = 1 + Math.abs(bank-prevBank)/Math.max(dt,.001)*.02;
    prevBank = bank;
    document.getElementById('vSpeed').textContent = Math.round(speed*3.6)+' km/h';
    document.getElementById('vAlt').textContent = Math.round(pilot.position.y*10)+' m';
    document.getElementById('vBank').textContent = Math.round(THREE.MathUtils.radToDeg(bank))+'°';
    document.getElementById('vG').textContent = g.toFixed(2)+' g';
    document.getElementById('vFps').textContent = fps;
    document.getElementById('vCalls').textContent = renderer.info.render.calls;
    document.getElementById('vTris').textContent = renderer.info.render.triangles.toLocaleString();
  }
  if(!status.ready){ status.ready = true; document.getElementById('loader').classList.add('gone'); }
}
function animate(){ requestAnimationFrame(animate); step(); }
window.__STEP__ = (n=1,dt=.016)=>{ for(let i=0;i<n;i++) step(dt); };
window.__SKY__ = {renderer, scene, camera, pilot, composer, clouds, sun};
animate();
</script>
</body>
</html>
